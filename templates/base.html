<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Semantic Employee & Skill Management System — A knowledge-graph-based employee management platform using RDF, OWL, and SPARQL.">
    <title>{% block title %}Semantic Employee System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="main-nav">
        <div class="nav-brand">
            <span class="nav-icon">🔗</span>
            <span class="nav-title">Semantic EMS</span>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" id="nav-dashboard">
                <span class="link-icon">📊</span> Dashboard
            </a></li>
            <li><a href="/employees" class="nav-link {% if request.path == '/employees' %}active{% endif %}" id="nav-employees">
                <span class="link-icon">👥</span> Employees
            </a></li>
            <li><a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}" id="nav-search">
                <span class="link-icon">🔍</span> Search
            </a></li>
            <li><a href="/projects" class="nav-link {% if request.path == '/projects' %}active{% endif %}" id="nav-projects">
                <span class="link-icon">📁</span> Projects
            </a></li>
            <li><a href="/graph" class="nav-link {% if request.path == '/graph' %}active{% endif %}" id="nav-graph">
                <span class="link-icon">🕸️</span> Knowledge Graph
            </a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% if error %}
        <div class="error-banner" id="page-error">
            <span class="error-icon">⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Semantic Employee & Skill Management System &mdash; Built with RDF, OWL, SPARQL &amp; Flask</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
