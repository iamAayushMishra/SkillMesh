<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkillMesh — Semantic Employee & Skill Management System built with RDF, OWL, and SPARQL.">
    <title>{% block title %}SkillMesh{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="main-nav">
        <div class="nav-brand">
            <span class="nav-icon">
                <span class="material-symbols-rounded" style="font-size:1.1rem;">hub</span>
            </span>
            <span class="nav-title">SkillMesh</span>
        </div>

        <ul class="nav-links">
            <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" id="nav-dashboard">
                Dashboard
            </a></li>
            <li><a href="/employees" class="nav-link {% if request.path == '/employees' %}active{% endif %}" id="nav-employees">
                Employees
            </a></li>
            <li><a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}" id="nav-search">
                Search
            </a></li>
            <li><a href="/projects" class="nav-link {% if request.path == '/projects' %}active{% endif %}" id="nav-projects">
                Projects
            </a></li>
            <li><a href="/graph" class="nav-link {% if request.path == '/graph' %}active{% endif %}" id="nav-graph">
                Graph
            </a></li>
        </ul>

        <div class="nav-right">
            <button class="nav-action" title="Search">
                <span class="material-symbols-rounded" style="font-size:1.15rem;">search</span>
            </button>
            <button class="nav-action" title="Notifications">
                <span class="material-symbols-rounded" style="font-size:1.15rem;">notifications</span>
            </button>
            <div class="nav-user">
                <div class="nav-user-avatar">SM</div>
                <span class="nav-user-name">Admin</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% if error %}
        <div class="error-banner" id="page-error">
            <span class="material-symbols-rounded" style="font-size:1.15rem;">warning</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>SkillMesh &mdash; Semantic Employee & Skill Management &middot; RDF &middot; OWL &middot; SPARQL &middot; Flask</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
